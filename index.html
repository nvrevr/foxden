<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Firefox Startpage</title>
    <style>
        /* Firefox UI Inspired Colors */
        :root {
            --firefox-bg-dark: #20232A; /* A common dark background in Firefox themes */
            --firefox-bg-elements-dark: #2B2B2B;
            --firefox-text-dark: #F0F0F0; /* Light text for dark backgrounds */
            --icon-color: #000000; /* Black icons as requested */
            --icon-hover-bg: #353940; /* Subtle hover background */
            --icon-size: 48px; /* Define a consistent size for icons */
        }

        body {
            background-color: var(--firefox-bg-dark);
            color: var(--firefox-text-dark);
            display: grid; /* Simple way to center a single element */
            place-items: center; /* Centers horizontally and vertically */
            min-height: 100vh; /* Ensure body takes full viewport height */
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            overflow: hidden; /* Hide scrollbars if content is slightly too big during transitions */
        }

        .button-container {
            display: flex;
            gap: 30px; /* Space between buttons */
            align-items: center; /* Vertically align items if they have different intrinsic heights */
        }

        .icon-button {
            display: flex; /* To center the SVG inside the anchor */
            justify-content: center;
            align-items: center;
            width: calc(var(--icon-size) + 30px); /* Add padding to width */
            height: calc(var(--icon-size) + 30px); /* Add padding to height */
            text-decoration: none;
            border-radius: 12px; /* Rounded corners for button feel */
            transition: background-color 0.2s ease-in-out, transform 0.2s ease-in-out;
        }

        .icon-button svg {
            width: var(--icon-size);
            height: var(--icon-size);
            fill: var(--icon-color); /* Explicitly set icon color */
            transition: transform 0.15s ease-in-out;
        }

        .icon-button:hover {
            background-color: var(--icon-hover-bg);
            transform: translateY(-3px); /* Slight lift on hover */
        }

        .icon-button:hover svg {
            /* Optional: slight scale on SVG itself for more dynamic hover */
            /* transform: scale(1.05); */
        }

        .icon-button:active {
            transform: translateY(-1px); /* Press down effect */
        }

        /* Specific styles if needed, though fill="black" in SVG is good */
        .youtube-icon {}
        .instagram-icon {}
        .play-icon {}

    </style>
</head>
<body>

    <div class="button-container">

        <a href="https://www.patreon.com/home" target="_blank" class="icon-button" aria-label="Patreon">

            <svg class="play-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/> <!-- Simple play triangle -->
                <!-- A more centered play button often looks like this:
                <path d="M6 19V5l14 7-14 7z"/>

    </div>

</html>
